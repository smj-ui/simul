<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM 원리 탐구실 (전체 화면 모드)</title>
  <style>
    :root {
      --navy: #0b1f3a;
      --navy2: #112d50;
      --cyan: #16c7c9;
      --blue: #eaf8fa;
      --ink: #16263d;
      --muted: #8ca0b5;
      --line: #203a5e;
      --paper: #fff;
      --ok: #168766;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 브라우저 화면 전체를 꽉 채우도록 설정 */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, sans-serif;
      background: var(--navy);
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* 1. 상단 네비게이션 헤더 (컴팩트 디자인) */
    header {
      height: 60px;
      background: var(--navy);
      border-bottom: 2px solid var(--cyan);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 1.05rem;
      white-space: nowrap;
    }

    .brand-badge {
      background: var(--cyan);
      color: var(--navy);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 900;
    }

    /* Step 1~3 탭 버튼 그룹 */
    .step-tabs {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px;
      border-radius: 10px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 8px 18px;
      border-radius: 7px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .tab-btn.active {
      background: var(--cyan);
      color: var(--navy);
    }

    .tab-btn .badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.15);
    }

    .tab-btn.done::after {
      content: "✓";
      margin-left: 4px;
      font-weight: bold;
      color: var(--ok);
    }
    .tab-btn.active.done::after {
      color: var(--navy);
    }

    /* 진행률 바 */
    .progress-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .progress-track {
      width: 100px;
      height: 6px;
      background: #1a3558;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--cyan);
      transition: width 0.3s ease;
    }

    /* 2. 메인 화면 영역 (100% 꽉 채움) */
    main {
      flex: 1;
      width: 100%;
      position: relative;
      background: #fff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* 3. 하단 컨트롤 바 */
    footer {
      height: 50px;
      background: var(--navy2);
      border-top: 1px solid var(--line);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      font-size: 0.88rem;
    }

    .lesson-info {
      color: #c5d8ea;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lesson-title-text {
      color: #fff;
      font-weight: bold;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: var(--cyan);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-complete {
      background: var(--cyan);
      color: var(--navy);
      border-color: var(--cyan);
    }

    .btn-complete.is-done {
      background: var(--ok);
      color: #fff;
      border-color: var(--ok);
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
      html, body { overflow: auto; height: auto; }
      header { flex-direction: column; height: auto; padding: 10px; gap: 10px; }
      .step-tabs { width: 100%; justify-content: space-between; }
      .tab-btn { padding: 6px 10px; font-size: 0.8rem; }
      main { height: 75vh; }
      footer { flex-direction: column; height: auto; padding: 10px; gap: 8px; }
      .lesson-info { display: none; }
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 헤더 -->
  <header>
    <div class="brand">
      <span class="brand-badge">AI</span>
      <span>LLM 원리 탐구실</span>
    </div>

    <!-- Step 1, 2, 3 전체 화면 전환 탭 -->
    <nav class="step-tabs" id="stepTabs">
      <!-- JavaScript로 생성됨 -->
    </nav>

    <div class="progress-box">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="progressText">0 / 3 완료</span>
    </div>
  </header>

  <!-- 메인 전체 화면 실습 영역 -->
  <main>
    <iframe id="simFrame" title="LLM 원리 탐구 실습"></iframe>
  </main>

  <!-- 하단 컨트롤 바 -->
  <footer>
    <div class="lesson-info">
      <span id="lessonStepLabel" style="color:var(--cyan); font-weight:bold;">Step 1</span>
      <span class="lesson-title-text" id="lessonTitle">다음 토큰 예측</span>
      <span id="lessonSummary" style="color:var(--muted); font-size:0.8rem;">| 문장은 어떻게 이어질까?</span>
    </div>

    <div class="actions">
      <button class="btn" id="prevBtn" type="button">← 이전</button>
      <button class="btn btn-complete" id="completeBtn" type="button">이 활동 완료하기</button>
      <button class="btn" id="nextBtn" type="button">다음 →</button>
    </div>
  </footer>

  <script>
    // GitHub Pages 폴더/파일 경로 구조 설정
    const lessons = [
      { id: 1, title: '다음 토큰 예측', short: '문장은 어떻게 이어질까?', path: './step1/' },
      { id: 2, title: '문맥과 Attention', short: '모델은 어디를 참고할까?', path: './step2/' },
      { id: 3, title: '환각과 사실 검증', short: '자연스러우면 사실일까?', path: './step3/' }
    ];

    const storageKey = 'llm-course-progress-v2';
    let current = 0;
    let completed = new Set();

    try {
      completed = new Set(JSON.parse(localStorage.getItem(storageKey) || '[]'));
    } catch (e) {
      completed = new Set();
    }

    const $ = id => document.getElementById(id);

    function saveProgress() {
      try {
        localStorage.setItem(storageKey, JSON.stringify([...completed]));
      } catch (e) {}
    }

    function renderTabs() {
      const tabsNav = $('stepTabs');
      tabsNav.innerHTML = lessons.map((l, i) => `
        <button type="button" class="tab-btn ${i === current ? 'active' : ''} ${completed.has(i) ? 'done' : ''}" data-step="${i}">
          <span class="badge">Step ${i + 1}</span>
          <span>${l.title}</span>
        </button>
      `).join('');

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => selectLesson(Number(btn.dataset.step)));
      });
    }

    function updateProgressUI() {
      const count = completed.size;
      $('progressFill').style.width = `${(count / lessons.length) * 100}%`;
      $('progressText').textContent = `${count} / ${lessons.length} 완료`;
    }

    function selectLesson(index) {
      current = Math.max(0, Math.min(lessons.length - 1, index));
      const l = lessons[current];

      // 화면 업데이트
      $('lessonStepLabel').textContent = `Step ${current + 1}`;
      $('lessonTitle').textContent = l.title;
      $('lessonSummary').textContent = `| ${l.short}`;
      $('simFrame').src = l.path;

      // 이전/다음 버튼 상태
      $('prevBtn').disabled = current === 0;
      $('nextBtn').disabled = current === lessons.length - 1;

      // 완료 버튼 상태
      const isDone = completed.has(current);
      $('completeBtn').textContent = isDone ? '✓ 완료됨 (다시 취소)' : '이 활동 완료하기';
      $('completeBtn').classList.toggle('is-done', isDone);

      renderTabs();
      updateProgressUI();
    }

    // 이벤트 리스너
    $('prevBtn').addEventListener('click', () => selectLesson(current - 1));
    $('nextBtn').addEventListener('click', () => selectLesson(current + 1));

    $('completeBtn').addEventListener('click', () => {
      if (completed.has(current)) {
        completed.delete(current);
      } else {
        completed.add(current);
      }
      saveProgress();
      selectLesson(current);

      // 완료 처리 시 자동으로 다음 단계로 매끄럽게 이동
      if (completed.has(current) && current < lessons.length - 1) {
        setTimeout(() => selectLesson(current + 1), 300);
      }
    });

    // 초기화 실행 (Step 1 첫 시작)
    selectLesson(0);
  </script>
</body>
</html>
